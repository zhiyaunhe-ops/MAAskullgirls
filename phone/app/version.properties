# SGM挂机 App 版本 —— **唯一事实源** (发版只改这里)
#
# versionName : 展示给人看的语义化版本, 必须与 git tag 一致 (tag = v<versionName>)
# versionCode : Android 的单调递增整数, 规则 = major*10000 + minor*100 + patch
#               1.0.0 → 10000, 1.0.1 → 10001, 1.2.0 → 10200
#               ⚠️ 只能**加**, 不能改小: 改小会让已装机器报 INSTALL_FAILED_VERSION_DOWNGRADE
#               (本地调试包 build-local.sh 固定写 9999, 那是另一码事, 它只用于覆盖安装)
#
# 发版流程见 tools/release.sh: 它负责改这里 + 同步 AndroidManifest + 打 tag + 推。
versionName=1.0.0
versionCode=10000
